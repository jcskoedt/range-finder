<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Range Finder</title>
<meta name="description" content="Build a training plan tailored to your sport, your goal, and your timeline.">
<meta name="theme-color" content="#F5E642">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23F5E642'/><text y='.9em' font-size='80' x='10'>⬛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=Turret+Road:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --yellow:#F5E642;
  --red:#CC2020;
  --text:#0A0A0A;
  --subtle:#777;
  --border:#0A0A0A;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden;}
html,body{background:var(--bg);color:var(--text);}
body{
  font-family:'Inter', sans-serif;
  line-height:1.5;
  max-width:640px;
  margin:0 auto;
  padding-bottom:80px;
}
.display{
  font-family:'Turret Road', sans-serif;
  font-weight:700;
  line-height:1.0;
  letter-spacing:-0.01em;
}
.eyebrow{
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--subtle);
  font-weight:500;
}
.hidden{display:none !important;}

/* ── TICKER ── */
.ticker-wrap{
  background:var(--text);
  overflow:hidden;
  width:100vw;
  margin-left:calc(50% - 50vw);
  border-bottom:2px solid var(--border);
  padding:9px 0;
  white-space:nowrap;
}
.ticker-track{
  display:inline-flex;
  gap:0;
  animation:ticker 70s linear infinite;
  will-change:transform;
}
.ticker-track:hover{animation-play-state:paused;}
.ticker-item{
  display:inline-flex;
  align-items:center;
  gap:0;
  font-family:'Turret Road',sans-serif;
  font-size:11px;
  font-weight:400;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--yellow);
  padding-right:0;
}
.ticker-sep{
  color:var(--yellow);
  opacity:0.4;
  margin:0 20px;
  font-size:10px;
}
@keyframes ticker{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}

/* ── HERO ── */
.hero{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:var(--text);
  padding:32px max(28px, calc((100vw - 640px) / 2 + 28px)) 40px;
  border-bottom:2px solid var(--border);
  margin-left:calc(50% - 50vw);
  width:100vw;
}
.hero-video{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:-2;
}
.hero-scrim{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(10,10,10,0.35) 0%, rgba(10,10,10,0.6) 100%);
  z-index:-1;
}
@media (min-width:1025px){
  .hero-video{
    top:50%;
    height:auto;
    aspect-ratio:16/9;
    transform:translateY(-50%);
  }
}
.hero-wordmark{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:40px;
  justify-content:space-between;
}
.hero-wordmark-icon{
  width:28px;height:28px;
  background:var(--text);
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.hero-wordmark-icon svg{
  width:16px;height:16px;
  fill:none;stroke:var(--yellow);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.hero-wordmark-text{
  font-family:'Turret Road',sans-serif;
  font-size:18px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  line-height:44px;
  color:var(--yellow);
}
.hero-eyebrow{
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  font-weight:200;
  font-family:'Inter',sans-serif;
  color:var(--yellow);
  opacity:0.9;
  margin-bottom:12px;
}
.hero h1{
  font-size:clamp(38px, 10vw, 52px);
  font-family:'Turret Road', sans-serif;
  font-weight:800;
  line-height:1.0;
  letter-spacing:-0.03em;
  text-transform:uppercase;
  color:var(--yellow);
}
.hero-sub{
  margin-top:18px;
  font-size:14px;
  max-width:340px;
  color:var(--yellow);
  opacity:0.85;
  line-height:1.6;
  font-weight:200;
}
.hero-actions{
  margin-top:32px;
  display:flex;
  gap:20px;
  align-items:center;
  flex-wrap:wrap;
}
.hero-cta-note{
  font-size:11px;
  color:var(--yellow);
  opacity:0.8;
  font-weight:200;
  letter-spacing:0.04em;
}
/* ── PROOF STRIP ── */
.proof-strip{
  padding:14px 24px;
  border-bottom:1px solid #E8E8E8;
  display:flex;
  align-items:center;
  gap:14px;
}
.proof-avatars{display:flex;}
.proof-avatar{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--bg);background:#CCC;
  margin-left:-5px;flex-shrink:0;
}
.proof-avatar:first-child{margin-left:0;background:#B8B8B8;}
.proof-avatar:nth-child(2){background:#A0A0A0;}
.proof-avatar:nth-child(3){background:#C8C8C8;}
.proof-text{font-size:11px;color:var(--subtle);line-height:1.4;font-weight:200;}
.proof-text strong{color:var(--text);font-weight:300;}
/* ── HOW IT WORKS (dropdown) ── */
.how-dropdown{border-top:1px solid #E8E8E8;}
.how-toggle{
  display:flex;align-items:center;gap:6px;
  padding:20px 24px;cursor:pointer;list-style:none;user-select:none;
  font-size:10px;font-weight:700;letter-spacing:0.18em;
  text-transform:uppercase;color:var(--subtle);
  font-family:'Turret Road',sans-serif;
}
.how-toggle::-webkit-details-marker{display:none;}
.how-toggle::after{content:'▾';font-size:10px;margin-left:auto;}
.how-dropdown[open]>.how-toggle::after{content:'▴';}
.how-body{padding:4px 24px 32px;}
.how-item{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px;}
.how-item:last-child{margin-bottom:0;}
.how-num{
  font-family:'Turret Road',sans-serif;font-size:11px;font-weight:700;
  color:var(--yellow);background:var(--text);
  width:22px;height:22px;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;
}
.how-text{font-size:13px;line-height:1.55;color:var(--subtle);font-weight:200;}
.how-text strong{display:block;font-weight:300;color:var(--text);margin-bottom:2px;}
/* ── GHOST CARD ── */
.ghost-card{
  border:1.5px dashed #E0E0E0;border-radius:6px;
  padding:16px 18px;margin-bottom:8px;
  display:flex;align-items:center;gap:14px;opacity:0.5;
}
.ghost-icon{width:32px;height:32px;border-radius:4px;background:#E8E8E8;flex-shrink:0;}
.ghost-lines{flex:1;display:flex;flex-direction:column;gap:6px;}
.ghost-line{height:9px;border-radius:3px;background:#E8E8E8;}
.ghost-line.short{width:50%;}
.ghost-line.med{width:72%;}

/* ── BUTTONS ── */
.btn{
  display:inline-block;
  background:var(--text);
  color:#fff;
  border:2px solid var(--text);
  font-family:'Turret Road',sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:12px 20px;
  min-height:44px;
  border-radius:0;
  cursor:pointer;
}
.btn:hover{background:var(--yellow);border-color:var(--text);color:var(--text);}
.btn-outline{
  background:transparent;
  border:2px solid var(--text);
  color:var(--text);
  font-family:'Turret Road',sans-serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:12px 20px;
  min-height:44px;
  cursor:pointer;
  border-radius:0;
}
.btn-outline:hover{background:var(--text);color:#fff;}
.btn-ghost{
  background:none;
  border:none;
  font-size:13px;
  color:var(--subtle);
  cursor:pointer;
  text-decoration:underline;
  padding:0;
}
.btn-red{
  background:var(--red);
  color:#fff;
  border:2px solid var(--red);
  font-size:13px;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  padding:12px 20px;
  cursor:pointer;
  border-radius:0;
}

/* ── PLAN CARDS (library) ── */
.plans-section{padding:0 24px;}
.plans-header{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:28px 0 16px;
  border-bottom:2px solid var(--border);
}
.plans-header span{
  font-size:11px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  font-weight:600;
}
.plan-card{
  display:flex;
  align-items:stretch;
  border-bottom:2px solid var(--border);
  cursor:pointer;
  transition:background 0.1s;
  min-height:100px;
}
.plan-card:hover{background:var(--yellow);}
.plan-card-num{
  width:56px;
  flex-shrink:0;
  border-right:2px solid var(--border);
  display:flex;
  align-items:flex-start;
  padding:16px 12px;
  font-family:'Turret Road', sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.06em;
  color:var(--subtle);
}
.plan-card-body{
  flex:1;
  padding:16px 16px;
}
.plan-card-sport{
  font-size:10px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--subtle);
  font-weight:600;
  margin-bottom:4px;
}
.plan-card-title{
  font-family:'Turret Road', sans-serif;
  font-size:20px;
  font-weight:700;
  line-height:1.1;
}
.plan-card-meta{
  font-size:12px;
  color:var(--subtle);
  margin-top:6px;
}
.plan-card-arrow{
  width:48px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border-left:2px solid var(--border);
}
.empty-state{
  padding:48px 0;
  text-align:center;
  color:var(--subtle);
  font-size:14px;
}
.empty-state strong{
  display:block;
  font-family:'Turret Road', sans-serif;
  font-size:22px;
  color:var(--text);
  margin-bottom:8px;
}

/* ── INNER PAGE HEADER ── */
.page-header{
  padding:24px 24px 20px;
  border-bottom:2px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}
.page-header-left .kicker{
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  font-weight:600;
  color:var(--subtle);
  margin-bottom:4px;
}
.page-header-left h1{
  font-family:'Turret Road', sans-serif;
  font-size:28px;
  font-weight:700;
  line-height:1.05;
}
.backlink{
  font-size:12px;
  color:var(--text);
  cursor:pointer;
  text-decoration:underline;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  margin-top:4px;
  display:inline-block;
  background:none;
  border:none;
  padding:0;
  font-family:'Inter',sans-serif;
}
.backlink:hover{color:var(--red);}
.backlink:focus-visible{outline:2px solid var(--red);outline-offset:2px;}

/* ── WIZARD ── */
.wizard-body{padding:0 24px 40px;}
.wizard-section-label{
  font-family:'Turret Road',sans-serif;
  font-size:10px;font-weight:700;
  letter-spacing:0.18em;text-transform:uppercase;
  color:var(--subtle);margin-bottom:12px;
}
/* Sport cards */
.sport-cards{display:flex;gap:0;margin-bottom:28px;}
.sport-card{
  flex:1;border:2px solid var(--border);border-right:none;
  padding:20px 8px;cursor:pointer;background:#fff;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:background 0.1s;
}
.sport-card:last-child{border-right:2px solid var(--border);}
.sport-card.active{background:var(--yellow);}
.sport-card-icon{font-size:22px;line-height:1;}
.sport-card-label{
  font-family:'Turret Road',sans-serif;font-size:10px;
  font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text);
}
/* Form fields */
.field{margin-bottom:0;padding:20px 0;border-top:1px solid #e8e8e8;}
.field:first-of-type{border-top:none;}
.field label{
  display:block;font-size:10px;text-transform:uppercase;
  letter-spacing:0.14em;font-weight:200;font-family:'Inter',sans-serif;
  color:var(--subtle);margin-bottom:10px;
}
.field input,.field select{
  width:100%;font-family:'Inter',sans-serif;font-weight:200;
  font-size:16px;padding:12px 0;
  border:none;border-bottom:2px solid var(--border);
  border-radius:0;background:transparent;color:var(--text);
  appearance:auto;
}
.field input:focus,.field select:focus{outline:none;border-bottom-color:var(--red);}
.sport-choice{display:flex;gap:0;}
.sport-choice button{
  flex:1;padding:16px 6px;border:2px solid var(--border);border-right:none;
  background:#fff;font-size:12px;font-weight:700;letter-spacing:0.06em;
  text-transform:uppercase;cursor:pointer;color:var(--text);
}
.sport-choice button:last-child{border-right:2px solid var(--border);}
.sport-choice button.active{background:var(--yellow);}
.wizard-actions{padding:28px 0 0;}

/* ── ROUTE TIMELINE ── */
.route-wrap{padding:0 24px;}
.route-label{
  font-size:10px;
  color:var(--subtle);
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
  letter-spacing:0.06em;
  text-transform:uppercase;
}
.route{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:0;padding:0;}
.tick{flex:1 0 auto;width:10px;height:20px;background:#e8e8e8;cursor:pointer;border-radius:0;}
.tick.partial{background:#ccc;}
.tick.done{background:var(--text);}

/* ── STATS ── */
.stats-bar{
  display:flex;
  border-top:2px solid var(--border);
  border-bottom:2px solid var(--border);
  margin:0;
}
.stat{
  flex:1;
  padding:18px 24px;
  border-right:2px solid var(--border);
}
.stat:last-child{border-right:none;}
.stat .num{
  font-family:'Turret Road', sans-serif;
  font-size:26px;
  font-weight:700;
  line-height:1;
}
.stat .lbl{
  font-size:10px;
  color:var(--subtle);
  text-transform:uppercase;
  letter-spacing:0.1em;
  margin-top:4px;
  font-weight:600;
}

/* ── IMPORT BOX ── */
.import-box{
  margin:0;
  border-bottom:2px solid var(--border);
  padding:20px 24px;
}
.import-box h3{
  font-family:'Turret Road', sans-serif;
  font-size:15px;
  font-weight:700;
  margin-bottom:4px;
}
.import-desc{font-size:13px;color:var(--subtle);margin-bottom:14px;}
.import-status{font-size:13px;color:var(--subtle);padding:8px 0;}
.upload-area{
  border:2px dashed #ccc;
  padding:22px;
  text-align:center;
  cursor:pointer;
  transition:border-color 0.15s, background 0.15s;
}
.upload-area:hover{border-color:var(--text);background:#fafafa;}
.upload-area.dragging{border-color:var(--red);background:#fff5f5;}
.upload-label{
  font-size:13px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
  color:var(--text);
  text-decoration:underline;
}
.upload-hint{font-size:11px;color:var(--subtle);margin-top:6px;letter-spacing:0.04em;}
.activity-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-top:1px solid #e0e0e0;
  font-size:13px;
}
.activity-row select{font-size:12px;padding:4px;border:1px solid #ccc;}

/* ── WEEKS ── */
.weeks-wrap{padding:0 24px;}
.week{border-bottom:2px solid var(--border);}
.week-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0;
  cursor:pointer;
}
.week-head:hover .week-title{text-decoration:underline;}
.week-num{
  font-family:'Turret Road', sans-serif;
  font-size:11px;
  font-weight:700;
  color:var(--subtle);
  letter-spacing:0.08em;
  min-width:40px;
}
.week-title{
  font-family:'Turret Road', sans-serif;
  font-size:16px;
  font-weight:700;
  flex:1;
  padding:0 12px;
}
.week-phase{
  font-size:10px;
  color:var(--subtle);
  text-transform:uppercase;
  letter-spacing:0.1em;
  font-weight:600;
}
.week-km{
  font-family:'Turret Road', sans-serif;
  font-size:13px;
  text-align:right;
  min-width:80px;
}
.week-arrow{font-size:14px;color:var(--subtle);margin-left:10px;}
.trainings{display:none;padding-bottom:16px;}
.trainings.open{display:block;}

.item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid #e8e8e8;}
.item:first-child{border-top:none;}
.checkbox{
  width:20px;height:20px;
  border:2px solid var(--border);
  flex-shrink:0;margin-top:1px;cursor:pointer;position:relative;
}
.checkbox.checked{background:var(--text);}
.checkbox.checked::after{
  content:'';position:absolute;
  left:5px;top:1px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg);
}
.item-body{flex:1;}
.item-label{font-size:14px;font-weight:600;}
.item-label.checked{color:var(--subtle);text-decoration:line-through;}
.item-note{font-size:12px;color:var(--subtle);margin-top:2px;}
.item-meta{font-size:12px;margin-top:6px;color:#444;}
.item-meta .meta-label{
  color:var(--subtle);text-transform:uppercase;
  font-size:10px;letter-spacing:0.08em;margin-right:5px;font-weight:700;
}
.item-km{display:flex;align-items:center;gap:8px;margin-top:8px;}
.item-km input{
  width:60px;font-size:13px;font-weight:700;
  font-family:'Turret Road', sans-serif;
  border:none;border-bottom:2px solid #ccc;
  background:transparent;color:var(--text);padding:2px 0;
}
.item-km input:focus{outline:none;border-bottom-color:var(--text);}
.item-km .planned{font-size:12px;color:var(--subtle);}
.item-source{font-size:11px;color:var(--red);margin-top:4px;font-weight:600;}

/* ── PLAN SUMMARY CARD ── */
.plan-summary-card{padding:20px 24px;border-bottom:2px solid var(--border);}
.psum-goal{
  font-family:'Turret Road',sans-serif;font-size:13px;font-weight:800;
  text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;
}
.psum-weeks{font-size:11px;color:var(--subtle);font-weight:600;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:16px;}
.psum-phase-now{margin-bottom:14px;}
.psum-phase-label{
  font-size:10px;color:var(--subtle);text-transform:uppercase;
  letter-spacing:0.1em;font-weight:700;margin-bottom:4px;
}
.psum-phase-name{
  font-family:'Turret Road',sans-serif;font-size:15px;font-weight:800;
  letter-spacing:0.05em;margin-bottom:5px;
}
.psum-phase-desc{font-size:12px;color:#555;line-height:1.5;font-style:italic;}
.psum-overview-intro{
  font-size:12px;color:#555;line-height:1.55;margin-bottom:14px;
}
.psum-phases-list{display:flex;flex-direction:column;gap:0;}
.psum-phase-row{
  padding:10px 0;border-top:1px solid #ebebeb;
}
.psum-phase-row.current{
  border-left:3px solid var(--yellow);padding-left:10px;margin-left:-10px;
}
.psum-phase-row-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px;}
.psum-phase-row-name{
  font-family:'Turret Road',sans-serif;font-size:12px;font-weight:800;
  letter-spacing:0.04em;
}
.psum-here-badge{
  font-family:'Inter',sans-serif;font-size:10px;font-weight:600;
  color:var(--text);font-style:normal;letter-spacing:0;
}
.psum-phase-row-meta{font-size:10px;color:var(--subtle);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;}
.psum-phase-row-desc{font-size:11px;color:#666;font-style:italic;line-height:1.45;}
.psum-faq{margin-top:14px;border-top:1px solid #e8e8e8;padding-top:10px;}
.psum-faq-toggle{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
  color:var(--subtle);cursor:pointer;list-style:none;user-select:none;
  display:flex;align-items:center;gap:6px;
}
.psum-faq-toggle::-webkit-details-marker{display:none;}
.psum-faq-toggle::after{content:'▾';font-size:10px;}
details[open].psum-faq .psum-faq-toggle::after{content:'▴';}
.psum-faq-body{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.psum-faq-row{display:flex;gap:8px;align-items:baseline;}
.psum-faq-name{
  font-family:'Turret Road',sans-serif;font-size:10px;font-weight:800;
  white-space:nowrap;min-width:72px;color:var(--text);
}
.psum-faq-desc{font-size:11px;color:#666;line-height:1.45;}

/* ── PHASE PLAN ── */
.phases-wrap{padding:0 0 32px;}
.phase-block{border-bottom:2px solid var(--border);}
.phase-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:18px 24px 14px 20px;
  cursor:pointer;
  border-left:4px solid transparent;
}
.phase-head.open{border-left-color:var(--yellow);}
.phase-head-inner{flex:1;}
.phase-name{
  font-family:'Turret Road',sans-serif;font-size:17px;font-weight:800;
  letter-spacing:0.04em;color:var(--text);
}
.phase-head:not(.open) .phase-name{color:var(--subtle);}
.phase-meta{font-size:10px;color:var(--subtle);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;}
.phase-arrow{font-size:11px;color:var(--subtle);margin-top:3px;flex-shrink:0;}
.phase-body{padding:0 24px 16px;}
.phase-desc{
  font-family:'Inter',sans-serif;font-size:12px;font-style:italic;
  color:#666;margin-bottom:14px;line-height:1.55;
}
/* Week card grid */
.phase-week-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.phase-week-card{
  border:2px solid var(--border);padding:12px;cursor:pointer;
}
.phase-week-card.current{background:var(--yellow);}
.phase-week-card.active{background:#e8e8e8;}
.phase-week-card.done{border-color:#ccc;opacity:0.5;}
.pwc-num{
  font-family:'Turret Road',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:0.08em;
}
.pwc-date{font-size:11px;color:#666;margin-top:4px;font-weight:300;}
.pwc-bottom{

  font-size:10px;color:var(--subtle);font-weight:600;
  text-transform:uppercase;letter-spacing:0.05em;
}
.phase-week-card.current .pwc-date,.phase-week-card.current .pwc-bottom{color:#333;}
/* Session list inside open week */
.phase-sessions{margin-top:12px;border:2px solid var(--border);padding:0 14px;}
.ps-item{border-top:1px solid #e8e8e8;}
.ps-item:first-child{border-top:none;}
.ps-row{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;}
.ps-info{flex:1;}
.ps-label{font-size:13px;font-weight:600;}
.ps-label.checked{color:var(--subtle);text-decoration:line-through;}
.ps-chevron{font-size:14px;color:var(--subtle);flex-shrink:0;}

/* ── REFERENCE ── */
.ref{padding:32px 24px 0;}
.ref-kicker{
  font-size:10px;letter-spacing:0.16em;text-transform:uppercase;

/* ── PLAN TABS ── */
.plan-tabs{
  display:flex;border-bottom:2px solid var(--border);
  position:sticky;top:0;background:var(--bg);z-index:10;
}
.plan-tab{
  flex:1;padding:16px 0;background:none;border:none;
  font-family:'Turret Road',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;
  color:var(--subtle);border-bottom:3px solid transparent;margin-bottom:-2px;
}
.plan-tab.active{color:var(--text);border-bottom-color:var(--yellow);}

/* ── TODAY CARD ── */

.today-guide-row{padding:14px 16px;border-top:1px solid #e8e8e8;font-size:13px;line-height:1.55;font-weight:200;}

.strip-dot{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,0.15);margin:0 auto 5px;}
.strip-dot.has-session{background:rgba(0,0,0,0.25);}

<body>

<div id="app"></div>

<script>
/* ---------------- STORAGE SHIM ---------------- */
if (!window.storage) {
  window.storage = {
    get: (key) => Promise.resolve(
      localStorage.getItem(key) !== null ? { value: localStorage.getItem(key) } : null
    ),
    set: (key, value) => Promise.resolve(localStorage.setItem(key, value)),
    delete: (key) => Promise.resolve(localStorage.removeItem(key)),
  };
}

/* ---------------- SPORT CONFIG ---------------- */
const SPORTS = {
  cykling: {
    label:"Cycling",
    intervalSchemes:["3x10 min sweet spot","4x12 min sweet spot","4x15 min sweet spot","3x20 min sweet spot"],
    tempoFn:(label,km,note)=>{
      const n=(note||"").toLowerCase();
      if(n.includes("lige efter")) return "Very easy, 18-20 km/h, RPE 3. Riding on tired legs from the day before.";
      if(n.includes("intervaller")) return "Easy warm-up/cool-down, 20-22 km/h, RPE 3-4. During intervals: RPE 6-7.";
      if(label.includes("lang tur")||label==="The Ride") return km>=150?"Very easy, 19-20 km/h, RPE 3-4. Hold back for the first 60-70 km.":"Easy, 19-21 km/h, RPE 3-5. Start conservatively.";
      if(n.includes("meget rolig")) return "Very easy, 18-20 km/h, RPE 2-3.";
      return "Easy, Zone 2, 20-22 km/h, RPE 3-4.";
    },
    nutritionFn:(km)=>{
      if(km>=200) return "Familiar breakfast before you start. Water throughout, 60-90 g carbs/hour, electrolytes.";
      if(km>=100) return "Steady hydration + electrolytes. 60-90 g carbs/hour from the start.";
      if(km>=70) return "Steady hydration. 1-2 gels, approx. 40-60 g carbs/hour after the first hour.";
      if(km>=40) return "Bring water. Consider an energy bar if the ride approaches 90 min.";
      return "Water only.";
    }
  },
  lob: {
    label:"Running",
    intervalSchemes:["4x4 min at threshold pace","5x5 min at threshold pace","3x8 min at threshold pace","2x15 min at threshold pace"],
    tempoFn:(label,km,note)=>{
      const n=(note||"").toLowerCase();
      if(n.includes("lige efter")) return "Very easy, conversational pace, RPE 3. Running on tired legs from the day before.";
      if(n.includes("intervaller")) return "Easy jog warm-up 10-15 min, then threshold intervals, easy cool-down. RPE 7-8 during intervals.";
      if(label.includes("lang tur")||label==="The Ride") return km>=25?"Very easy, conversational pace, RPE 3-4. Hold back for the first 25%.":"Easy, conversational pace, RPE 3-5.";
      if(n.includes("meget rolig")) return "Very easy jog pace, RPE 2-3.";
      return "Easy jog pace, RPE 3-4 — you should be able to speak in full sentences.";
    },
    nutritionFn:(km)=>{
      if(km>=30) return "Water + electrolytes throughout. 30-60 g carbs/hour from the start.";
      if(km>=18) return "Water throughout. 1 gel after 60 min, approx. 30-40 g carbs/hour after that.";
      if(km>=10) return "Water is enough — maybe a sip or two if it's hot.";
      return "Water only.";
    }
  },
  svomning: {
    label:"Swimming",
    intervalSchemes:["8x100m, 20 sec rest","10x100m, 15 sec rest","6x200m, 30 sec rest","4x300m, 30 sec rest"],
    tempoFn:(label,km,note)=>{
      const n=(note||"").toLowerCase();
      if(n.includes("lige efter")) return "Very easy, technique focus, no intensity.";
      if(n.includes("intervaller")) return "300-400m easy warm-up, then interval set, easy cool-down. RPE 6-7 during the set.";
      if(label.includes("lang tur")||label==="The Ride") return "Steady easy pace, focus on maintaining technique throughout, RPE 3-5.";
      if(n.includes("meget rolig")) return "Very easy, technique focus, RPE 2-3.";
      return "Easy, technique focus, RPE 3-4.";
    },
    nutritionFn:(km)=>{
      if(km>=6) return "Electrolytes and fuel at rest stops/turns every 30-45 min.";
      if(km>=3) return "Water at rest stops. Consider some fuel if swimming continuously for over 60 min.";
      return "Water at rest stops is enough.";
    }
  }
};

/* ---------------- PLAN GENERATION ---------------- */
function roundStep(x,target){
  const step=target>=50?5:(target>=10?1:0.5);
  return Math.max(step,Math.round(x/step)*step);
}
function supportFractions(count){
  const t={0:[],1:[0.35],2:[0.28,0.36],3:[0.25,0.30,0.36],4:[0.22,0.26,0.30,0.36]};
  return t[count]||t[3];
}
function generatePlan(sportKey,targetKm,weeksAvailable,sessionsPerWeek,currentLongest,minSession){
  minSession=minSession||0;
  weeksAvailable=Math.max(1,Math.min(52,Math.round(weeksAvailable)));
  sessionsPerWeek=Math.max(1,Math.min(5,Math.round(sessionsPerWeek)));
  const supFracs=supportFractions(sessionsPerWeek-1);
  const rnd=(x)=>Math.max(minSession,roundStep(x,targetKm));
  const peak=rnd(targetKm*0.8);
  const startLong=rnd(currentLongest?Math.max(currentLongest*0.85,targetKm*0.2):targetKm*0.3);
  const scheme=SPORTS[sportKey].intervalSchemes;
  const weeks=[];

  const SNAMES={
    cykling:{support:["Zone 2 ride","Interval session","Recovery ride","Zone 2 ride"],long:"Long ride",event:"Race day",b2b0:"Long ride (day 1)",b2b1:"Easy ride (day 2)"},
    lob:{support:["Easy run","Tempo session","Recovery jog","Easy run"],long:"Long run",event:"Race day",b2b0:"Long run (day 1)",b2b1:"Easy jog (day 2)"},
    svomning:{support:["Easy swim","Interval set","Recovery swim","Easy swim"],long:"Long swim",event:"Race day",b2b0:"Long swim (day 1)",b2b1:"Easy swim (day 2)"}
  };
  const SN=SNAMES[sportKey]||SNAMES.cykling;

  function buildItems(longKm,opts){
    opts=opts||{};
    const items=[];
    const fracs=opts.support!=null?opts.support:supFracs;
    fracs.forEach((f,i)=>{
      let note=null;
      const label=opts.veryEasy?"Recovery":(opts.intervalIdx!=null&&i===0?SN.support[1]:SN.support[i]||SN.support[0]);
      if(opts.intervalIdx!=null&&i===0) note="intervals: "+scheme[opts.intervalIdx%scheme.length];
      else if(opts.veryEasy) note="very easy";
      items.push([label,rnd(longKm*f),note]);
    });
    if(opts.backToBack){
      items.push([SN.b2b0,rnd(longKm*0.78)]);
      items.push([SN.b2b1,rnd(longKm*0.58),"right after previous session, no rest day in between"]);
    } else if(opts.isEvent){
      items.push([SN.event,targetKm,opts.eventNote||null]);
    } else {
      items.push([SN.long,rnd(longKm),opts.longNote||null]);
    }
    return items;
  }

  if(weeksAvailable<8){
    const taperCount=Math.max(1,Math.min(2,Math.floor(weeksAvailable/3)));
    const buildCount=weeksAvailable-taperCount;
    for(let w=0;w<buildCount;w++){
      const lk=rnd(startLong+(peak*0.55-startLong)*(buildCount<=1?1:w/(buildCount-1)));
      weeks.push({phase:"Build",items:buildItems(lk,{})});
    }
    for(let t=0;t<taperCount;t++){
      const isLast=t===taperCount-1;
      const lk=rnd(peak*0.55*(1-t*0.4));
      if(isLast) weeks.push({phase:"Race Week",items:buildItems(lk*0.4,{support:[0.3],isEvent:true})});
      else weeks.push({phase:"Taper",items:buildItems(lk,{veryEasy:true})});
    }
    return weeks;
  }

  const taperWeeks=weeksAvailable>=16?3:2;
  const preTaper=weeksAvailable-taperWeeks;
  const numBlocks=Math.max(1,Math.floor(preTaper/4));
  const leftover=preTaper-numBlocks*4;
  const blockPattern=[];
  for(let i=0;i<leftover;i++) blockPattern.push({type:"load",extra:true});
  for(let b=0;b<numBlocks;b++){
    blockPattern.push({type:"load"});blockPattern.push({type:"load"});
    blockPattern.push({type:"load"});blockPattern.push({type:"recovery"});
  }
  let lastLoadIdx=-1;
  blockPattern.forEach((w,i)=>{if(w.type==="load")lastLoadIdx=i;});
  if(lastLoadIdx>=0) blockPattern[lastLoadIdx].isPeak=true;
  const loadIndices=blockPattern.map((w,i)=>(w.type==="load"&&!w.isPeak&&!w.extra)?i:-1).filter(i=>i>=0);
  const b2bCount=Math.min(2,Math.max(0,Math.floor(loadIndices.length/3)));
  const b2bIndices=[];
  if(b2bCount>0){
    const half=loadIndices.slice(Math.floor(loadIndices.length/2));
    for(let k=0;k<b2bCount;k++){const idx=half[Math.floor(k*half.length/b2bCount)];if(idx!=null)b2bIndices.push(idx);}
  }
  const loadOrder=blockPattern.map((w,i)=>w.type==="load"?i:-1).filter(i=>i>=0);
  let intervalCounter=0;
  const firstIntervalWeekPos=Math.max(1,Math.floor(loadOrder.length*0.15));
  blockPattern.forEach((w,i)=>{
    const posInLoad=loadOrder.indexOf(i);
    const t=loadOrder.length<=1?1:posInLoad/(loadOrder.length-1);
    const lk=rnd(startLong+(peak-startLong)*t);
    if(w.isPeak){weeks.push({phase:"Peak",items:buildItems(peak,{support:supFracs.map(f=>f*0.75),longNote:"plan's longest session — a full dress rehearsal for race day"})});return;}
    if(w.type==="recovery"){weeks.push({phase:phaseName(i,numBlocks,leftover)+" · recovery",items:buildItems(rnd(lk*0.55),{})});return;}
    if(b2bIndices.includes(i)){weeks.push({phase:phaseName(i,numBlocks,leftover)+" · back-to-back",items:buildItems(lk,{backToBack:true})});return;}
    let intervalIdx=null;
    if(posInLoad>=firstIntervalWeekPos){intervalIdx=intervalCounter%scheme.length;intervalCounter++;}
    weeks.push({phase:phaseName(i,numBlocks,leftover),items:buildItems(lk,{intervalIdx})});
  });
  for(let t=0;t<taperWeeks;t++){
    const isLast=t===taperWeeks-1;
    const lk=rnd(peak*(0.6-0.18*t));
    if(isLast) weeks.push({phase:"Race Week",items:buildItems(rnd(targetKm*0.12),{support:[0.3],isEvent:true,eventNote:"rest up before and after"})});
    else weeks.push({phase:"Taper",items:buildItems(lk,{})});
  }
  return weeks;
}
function phaseName(i,numBlocks,leftover){
  if(i<leftover) return "Base 1";
  const blockIdx=Math.floor((i-leftover)/4);
  const names=["Base 1","Base 2","Build 1","Build 2","Peak"];
  const scaledIdx=numBlocks<=1?0:Math.floor(blockIdx*(names.length-1)/(numBlocks-1));
  return names[Math.min(scaledIdx,names.length-1)];
}

/* ---------------- STORAGE ---------------- */
const INDEX_KEY="plans-index";
const STORAGE_TIMEOUT_MS=6000;
function withTimeout(promise,ms,fallback){return Promise.race([promise,new Promise(r=>setTimeout(()=>r(fallback),ms))]);}
async function loadIndex(){try{const r=await withTimeout(window.storage.get(INDEX_KEY,false),STORAGE_TIMEOUT_MS,null);return r&&r.value?JSON.parse(r.value):[]}catch(e){return[];}}
async function saveIndex(idx){try{await withTimeout(window.storage.set(INDEX_KEY,JSON.stringify(idx),false),STORAGE_TIMEOUT_MS,null);}catch(e){}}
async function loadPlan(id){try{const r=await withTimeout(window.storage.get("plan-"+id,false),STORAGE_TIMEOUT_MS,null);return r&&r.value?JSON.parse(r.value):null;}catch(e){return null;}}
async function savePlan(plan){try{await withTimeout(window.storage.set("plan-"+plan.id,JSON.stringify(plan),false),STORAGE_TIMEOUT_MS,null);}catch(e){}}

/* ---------------- DATE HELPERS ---------------- */
function sessionDayOffsets(n){
  return ({1:[3],2:[1,5],3:[0,3,5],4:[0,2,4,6],5:[0,1,3,5,6]})[Math.min(5,Math.max(1,n))]||[0,3,5];
}
function getSessionDate(plan,wIdx,sIdx){
  if(!plan.startDate)return null;
  const ikey=keyFor(wIdx,sIdx);
  if(plan.dateOverrides&&plan.dateOverrides[ikey]){
    return new Date(plan.dateOverrides[ikey]);
  }
  const offs=sessionDayOffsets(plan.sessionsPerWeek);
  const d=new Date(plan.startDate);
  d.setDate(d.getDate()+wIdx*7+(offs[sIdx]!==undefined?offs[sIdx]:sIdx*2));
  return d;
}
function fmtDate(d){
  if(!d)return"";
  return d.toLocaleDateString("da-DK",{weekday:"short",day:"numeric",month:"short"});
}
function isToday(d){
  if(!d)return false;
  const t=new Date();
  return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();
}
function isFuture(d){
  if(!d)return false;
  const t=new Date();t.setHours(0,0,0,0);
  const dc=new Date(d);dc.setHours(0,0,0,0);
  return dc>t;
}

/* ---------------- PLAN VIEW ---------------- */
function keyFor(w,i){return w+"_"+i;}
function isWeekDone(plan,wIdx){return plan.weeks[wIdx].items.every((_,i)=>plan.progress[keyFor(wIdx,i)]&&plan.progress[keyFor(wIdx,i)].done);}
function isWeekPartial(plan,wIdx){return plan.weeks[wIdx].items.some((_,i)=>plan.progress[keyFor(wIdx,i)]&&plan.progress[keyFor(wIdx,i)].done);}
function computeStats(plan){
  let ds=0,ts=0,dk=0,tk=0;
  plan.weeks.forEach((w,wIdx)=>{w.items.forEach((item,i)=>{ts++;tk+=item[1];const p=plan.progress[keyFor(wIdx,i)];if(p&&p.done){ds++;dk+=(p.actualKm!=null&&p.actualKm!=="")?Number(p.actualKm):item[1];}});});
  let aw=plan.weeks.findIndex((w,wIdx)=>!isWeekDone(plan,wIdx));
  if(aw===-1)aw=plan.weeks.length-1;
  return{doneSessions:ds,totalSessions:ts,doneKm:dk,totalKm:tk,activeWeek:aw+1};
}

  outer:for(let wIdx=0;wIdx<plan.weeks.length;wIdx++){
    for(let sIdx=0;sIdx<plan.weeks[wIdx].items.length;sIdx++){
      const sd=getSessionDate(plan,wIdx,sIdx);

  // Find next session after selDate

  {let bestTime=Infinity;
  for(let wIdx=0;wIdx<plan.weeks.length;wIdx++){
    for(let sIdx=0;sIdx<plan.weeks[wIdx].items.length;sIdx++){
      const sd=getSessionDate(plan,wIdx,sIdx);

        </div>
        <div style="margin-top:6px;font-size:11px;color:rgba(255,255,255,0.4);">${fmtDate(selDate)}</div>
      </div>`;
    } else {
      cardHtml=`<div class="today-card">
        <span class="today-phase-tag">${ts.w.phase}</span>
        <div class="today-card-name">${label}</div>
        <div class="today-card-km">${km} km</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" id="todayLogBtn" style="font-size:12px;padding:10px 20px;">Log session →</button>
          <button class="btn btn-outline" id="todayMoveBtn" style="font-size:11px;padding:6px 14px;min-height:32px;">Flyt træning</button>

  } else {

  }

  c.innerHTML=`${cardHtml}${extrasForSelHtml?`<div style="margin-top:0;">${extrasForSelHtml}</div>`:""}${guideHtml}${nextHtml}<div style="display:flex;align-items:center;justify-content:space-between;margin:20px 24px 0;"><button id="stripPrevBtn" class="btn btn-outline" style="font-size:16px;padding:4px 12px;min-height:32px;line-height:1;">‹</button><span style="font-family:'Turret Road',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--subtle);">${weekLabel}</span><button id="stripNextBtn" class="btn btn-outline" style="font-size:16px;padding:4px 12px;min-height:32px;line-height:1;">›</button></div><div class="week-strip" style="margin-top:8px;">${stripHtml}</div><div class="add-extra-wrap"><button class="btn btn-outline" id="addExtraBtn" style="width:100%;font-size:12px;padding:10px;">+ Tilføj ekstra træning</button><div id="addExtraForm" style="display:none;margin-top:12px;"></div></div><div style="height:32px;"></div>`;

  // Wire log button
  if(ts){
    const[,km]=ts.item;const ikey=keyFor(ts.wIdx,ts.sIdx);
    const lb=document.getElementById("todayLogBtn");
    if(lb)lb.onclick=async()=>{const cur=plan.progress[ikey]||{done:false,actualKm:null};cur.done=true;if(!cur.actualKm)cur.actualKm=km;plan.progress[ikey]=cur;await savePlan(plan);renderTabToday(plan,c);};
    const ub=document.getElementById("todayUndoBtn");
    if(ub)ub.onclick=async()=>{const cur=plan.progress[ikey]||{done:false,actualKm:null};cur.done=false;plan.progress[ikey]=cur;await savePlan(plan);renderTabToday(plan,c);};
    const kmI=document.getElementById("todayActKm");
    if(kmI){kmI.onclick=(e)=>e.stopPropagation();kmI.onchange=async(e)=>{const cur=plan.progress[ikey]||{done:true};cur.actualKm=e.target.value;plan.progress[ikey]=cur;await savePlan(plan);};}
    // Wire move button
    const mb=document.getElementById("todayMoveBtn");
    if(mb)mb.onclick=()=>{
      if(document.getElementById("moveForm"))return;
      const existOverride=plan.dateOverrides&&plan.dateOverrides[ikey]?plan.dateOverrides[ikey]:selDateStr;
      mb.insertAdjacentHTML("afterend",`<div id="moveForm" style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><input type="date" id="moveDateInput" value="${existOverride}" style="font-family:'Inter',sans-serif;font-size:13px;padding:6px 8px;border:2px solid var(--border);background:transparent;"><button class="btn" id="moveConfirmBtn" style="font-size:11px;padding:6px 14px;min-height:32px;">Bekræft</button></div>`);
      document.getElementById("moveConfirmBtn").onclick=async()=>{
        const newDate=document.getElementById("moveDateInput").value;
        if(!newDate)return;
        if(!plan.dateOverrides)plan.dateOverrides={};
        plan.dateOverrides[ikey]=newDate;
        await savePlan(plan);viewDay=null;renderTabToday(plan,c);
      };
    };
  }

  // Wire strip day clicks
  c.querySelectorAll(".strip-day[data-ts]").forEach(sd=>{
    sd.style.cursor="pointer";
    sd.onclick=()=>{
      const clicked=new Date(parseInt(sd.dataset.ts));clicked.setHours(0,0,0,0);
      viewDay=clicked.getTime()===today2.getTime()?null:clicked;
      renderTabToday(plan,c);
    };
  });

  // Wire week nav buttons
  const prevBtn=document.getElementById("stripPrevBtn");
  const nextBtn=document.getElementById("stripNextBtn");
  if(prevBtn)prevBtn.onclick=()=>{viewWeekOffset--;renderTabToday(plan,c);};
  if(nextBtn)nextBtn.onclick=()=>{viewWeekOffset++;renderTabToday(plan,c);};

  // Wire extra log buttons (today's extras)
  c.querySelectorAll("[data-extra-log]").forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const ei=parseInt(btn.dataset.extraLog);
      if(!plan.extras||!plan.extras[ei])return;
      plan.extras[ei].done=!plan.extras[ei].done;
      await savePlan(plan);renderTabToday(plan,c);
    };
  });

  // Wire add extra training
  const aeb=document.getElementById("addExtraBtn");
  const aef=document.getElementById("addExtraForm");
  if(aeb&&aef){
    aeb.onclick=()=>{
      aeb.style.display="none";aef.style.display="block";
      aef.innerHTML=`<div style="border:2px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px;">
        <input id="extraLabel" type="text" placeholder="Navn (fx Løbetur)" style="font-family:'Inter',sans-serif;font-size:14px;font-weight:200;padding:8px;border:2px solid var(--border);background:transparent;width:100%;box-sizing:border-box;">
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="extraKm" type="number" inputmode="numeric" placeholder="Km" style="font-family:'Turret Road',sans-serif;font-size:14px;font-weight:700;padding:8px;border:2px solid var(--border);background:transparent;width:80px;">
          <input id="extraDate" type="date" value="${selDateStr}" style="font-family:'Inter',sans-serif;font-size:13px;padding:8px;border:2px solid var(--border);background:transparent;flex:1;">
        </div>
        <div id="extraUploadArea" style="border:2px dashed #ccc;padding:20px;text-align:center;cursor:pointer;transition:border-color 0.15s,background 0.15s;">
          <input type="file" id="extraFile" accept="image/*" style="display:none;">
          <div id="extraUploadLabel" style="font-size:12px;color:var(--subtle);font-weight:200;">Upload screenshot (valgfrit)</div>
          <img id="extraPreview" style="display:none;max-width:100%;margin-top:8px;max-height:120px;object-fit:contain;">
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="extraSaveBtn" style="flex:1;font-size:12px;padding:10px;">Gem ekstra træning</button>
          <button class="btn btn-outline" id="extraCancelBtn" style="font-size:12px;padding:10px;">Afbryd</button>
        </div>
      </div>`;
      let extraScreenshot=null;
      const uploadArea=document.getElementById("extraUploadArea");
      const fileInput=document.getElementById("extraFile");
      const preview=document.getElementById("extraPreview");
      const uploadLabel=document.getElementById("extraUploadLabel");
      uploadArea.onclick=()=>fileInput.click();
      uploadArea.ondragover=(e)=>{e.preventDefault();uploadArea.style.borderColor="var(--text)";uploadArea.style.background="#f8f8f8";};
      uploadArea.ondragleave=()=>{uploadArea.style.borderColor="#ccc";uploadArea.style.background="";};
      uploadArea.ondrop=(e)=>{e.preventDefault();uploadArea.style.borderColor="#ccc";uploadArea.style.background="";if(e.dataTransfer.files[0])processFile(e.dataTransfer.files[0]);};
      fileInput.onchange=()=>{if(fileInput.files[0])processFile(fileInput.files[0]);};
      function processFile(f){
        const reader=new FileReader();
        reader.onload=(ev)=>{extraScreenshot=ev.target.result;preview.src=ev.target.result;preview.style.display="block";uploadLabel.style.display="none";};
        reader.readAsDataURL(f);
      }
      document.getElementById("extraCancelBtn").onclick=()=>{aef.style.display="none";aeb.style.display="";};
      document.getElementById("extraSaveBtn").onclick=async()=>{
        const lbl=document.getElementById("extraLabel").value.trim();
        const km=parseFloat(document.getElementById("extraKm").value)||0;
        const date=document.getElementById("extraDate").value;
        if(!lbl||!date)return;
        if(!plan.extras)plan.extras=[];
        plan.extras.push({date,label:lbl,km,done:false,screenshot:extraScreenshot||null});
        await savePlan(plan);renderTabToday(plan,c);
      };
    };
  }
}

/* ---------------- TAB: PLAN ---------------- */
function renderTabPlan(plan,c){
  const sport=SPORTS[plan.sport];
  // Group weeks by phase (preserve order)
  const phases=[];const phaseMap={};
  plan.weeks.forEach((w,wIdx)=>{
    const ph=(w.phase||'GENEREL').replace(/\s*·.*/,"");
    if(!phaseMap[ph]){phaseMap[ph]={name:ph,weeks:[]};phases.push(phaseMap[ph]);}
    phaseMap[ph].weeks.push({w,wIdx});
  });
  const s2=computeStats(plan);const activeWIdx=s2.activeWeek-1;
  let phasesHtml='';
  phases.forEach(phase=>{
    const allWkIdx=phase.weeks.map(pw=>pw.wIdx);
    const startWk=Math.min(...allWkIdx)+1;const endWk=Math.max(...allWkIdx)+1;
    const totalKm=phase.weeks.reduce((acc,{w})=>acc+w.items.reduce((a,item)=>a+item[1],0),0);
    const wCount=phase.weeks.length;
    const isPhaseOpen=openPhaseKey===phase.name;
    let bodyHtml='';
    if(isPhaseOpen){
      // Week card grid
      let gridHtml='<div class="phase-week-grid">';
      phase.weeks.forEach(({w,wIdx})=>{
        const kmDone=w.items.reduce((acc,item,i)=>{const p=plan.progress[keyFor(wIdx,i)];if(p&&p.done)return acc+((p.actualKm!=null&&p.actualKm!=='')?Number(p.actualKm):item[1]);return acc;},0);
        const kmTotal=w.items.reduce((acc,item)=>acc+item[1],0);
        const wStartDate=getSessionDate(plan,wIdx,0);
        const wDateStr=wStartDate?fmtDate(wStartDate):'';
        const isCurrent=wIdx===activeWIdx;
        const isDone=kmDone>=kmTotal&&kmTotal>0;
        const isWkOpen=openWeekIdx===wIdx;
        gridHtml+=`<div class="phase-week-card${isCurrent?' current':''}${isDone?' done':''}${isWkOpen?' active':''}" data-weekidx="${wIdx}">
          <div class="pwc-num">#${String(wIdx+1).padStart(2,'0')} UGE ${wIdx+1}</div>
          <div class="pwc-date">${wDateStr}</div>
          <div class="pwc-bottom"><span>${w.items.length} sess.</span><span>${kmDone}/${kmTotal} km</span></div>
        </div>`;
      });
      gridHtml+='</div>';
      // Session drill-down for selected week (if it belongs to this phase)
      let sessHtml='';
      if(openWeekIdx!==null&&allWkIdx.includes(openWeekIdx)){
        const openW=plan.weeks[openWeekIdx];
        sessHtml='<div class="phase-sessions">';
        openW.items.forEach((item,i)=>{
          const[label,km,note]=item;
          const ikey=keyFor(openWeekIdx,i);
          const p=plan.progress[ikey]||{done:false,actualKm:null};
          const sd=getSessionDate(plan,openWeekIdx,i);
          const dateStr=sd?fmtDate(sd):'';
          const isExp=openItemKey===ikey;
          sessHtml+=`<div class="ps-item${p.done?' done':''}">
            <div class="ps-row" data-expand="${ikey}" style="cursor:pointer;">
              <div class="checkbox${p.done?' checked':''}" data-cb="${ikey}" data-weekidx="${openWeekIdx}" data-i="${i}" data-km="${km}"></div>
              <div class="ps-info">
                ${dateStr?`<div class="item-date">${dateStr}</div>`:''}
                <div class="ps-label${p.done?' checked':''}">${label} · ${km} km</div>
              </div>
              <div class="ps-chevron">${isExp?'−':'+'}</div>
            </div>
            <div class="item-detail${isExp?' open':''}">
              ${note?`<div class="item-note" style="margin-bottom:8px;">${note}</div>`:''}
              <div class="item-meta"><span class="meta-label">Pace</span>${sport.tempoFn(label,km,note)}</div>
              <div class="item-meta"><span class="meta-label">Ernæring</span>${sport.nutritionFn(km)}</div>
              <div class="item-km" style="margin-top:12px;">
                <input type="number" inputmode="numeric" value="${p.actualKm!=null?p.actualKm:km}" data-inp="${ikey}" data-km="${km}"/>
                <span class="planned">/ ${km} km planlagt</span>
              </div>
              ${p.source?`<div class="item-source">↑ ${p.source}</div>`:''}
              ${!p.done?`<button class="btn" style="margin-top:12px;font-size:12px;padding:10px 18px;" data-logbtn="${ikey}" data-weekidx="${openWeekIdx}" data-i="${i}" data-km="${km}">Marker gennemført · ${km} km</button>`:''}
            </div>
          </div>`;
        });
        sessHtml+='</div>';
      }
      bodyHtml=`${gridHtml}${sessHtml}`;
    }
    phasesHtml+=`<div class="phase-block">
      <div class="phase-head${isPhaseOpen?' open':''}" data-phase="${phase.name}">
        <div class="phase-head-inner">
          <div class="phase-name">${phase.name}</div>
          <div class="phase-meta">Uge ${startWk}${startWk!==endWk?'–'+endWk:''} · ${wCount} ${wCount===1?'uge':'uger'} · ${totalKm} km</div>
        </div>
        <div class="phase-arrow">${isPhaseOpen?'▲':'▼'}</div>
      </div>
      ${isPhaseOpen?`<div class="phase-body">${bodyHtml}</div>`:''}
    </div>`;
  });

  // Plan summary card
  const stats=computeStats(plan);
  const totalPlanKm=plan.weeks.reduce((acc,w)=>acc+w.items.reduce((a,item)=>a+item[1],0),0);
  const sportLabel=plan.sport?plan.sport.charAt(0).toUpperCase()+plan.sport.slice(1):'Sport';
  const weeksLeft=plan.weeks.length-(stats.activeWeek-1);

  c.innerHTML=`<div class="plan-summary-card">
    <div class="psum-goal">${plan.label||'Din plan'}</div>
    <div class="psum-meta">${sportLabel} · ${totalPlanKm} km total · ${plan.weeks.length} uger · ${weeksLeft} uger tilbage</div>
    <details class="psum-faq">
      <summary class="psum-faq-toggle">Hvad betyder faserne?</summary>
      <div class="psum-faq-body">
        <div class="psum-faq-row"><span class="psum-faq-name">BASE</span><span class="psum-faq-desc">Opbygger det aerobe fundament — lav intensitet, høj volumen.</span></div>
        <div class="psum-faq-row"><span class="psum-faq-name">BUILD</span><span class="psum-faq-desc">Intervaller og tempo-ture forbereder kroppen til race-pace.</span></div>
        <div class="psum-faq-row"><span class="psum-faq-name">PEAK</span><span class="psum-faq-desc">Maksimal belastning. Du er nu på dit allerstærkeste.</span></div>
        <div class="psum-faq-row"><span class="psum-faq-name">TAPER</span><span class="psum-faq-desc">Reduceret volumen — kroppen hviler og lader op til løbet.</span></div>
        <div class="psum-faq-row"><span class="psum-faq-name">RACE WEEK</span><span class="psum-faq-desc">Friske ben og fokus. Det er dit løb nu.</span></div>
      </div>
    </details>
  </div>
  <div class="import-box">
    <h3>Importér fra screenshot</h3>
    <p class="import-desc">Upload et screenshot fra Strava, Garmin, Polar eller lignende — vi finder dine aktiviteter automatisk.</p>
    <div id="importArea"><div class="upload-area" id="uploadDropzone">
      <label class="upload-label" for="screenshotInput">Vælg billede</label>
      <input type="file" id="screenshotInput" accept="image/*" style="display:none;">
      <div class="upload-hint">PNG, JPG eller WebP · Strava, Garmin, Polar og mere</div>
    </div></div>
  </div>
  <div class="phases-wrap">${phasesHtml}</div>`;

  wireUploadArea();

  // Phase toggle
  c.querySelectorAll(".phase-head[data-phase]").forEach(head=>{
    head.onclick=()=>{
      const ph=head.dataset.phase;
      if(openPhaseKey===ph){openPhaseKey=null;openWeekIdx=null;}
      else{openPhaseKey=ph;openWeekIdx=null;}
      openItemKey=null;renderTabPlan(plan,c);
    };
  });
  // Week card toggle — use data-weekidx (lowercase) so dataset.weekidx works correctly
  c.querySelectorAll(".phase-week-card[data-weekidx]").forEach(card=>{
    card.onclick=()=>{
      const wIdx=parseInt(card.dataset.weekidx);
      openWeekIdx=(openWeekIdx===wIdx)?null:wIdx;
      openItemKey=null;renderTabPlan(plan,c);
    };
  });
  // Session expand/collapse
  c.querySelectorAll(".ps-row[data-expand]").forEach(row=>{
    row.onclick=(e)=>{
      const ikey=row.dataset.expand;
      openItemKey=(openItemKey===ikey)?null:ikey;renderTabPlan(plan,c);
    };
  });
  // Checkboxes
  c.querySelectorAll("[data-cb]").forEach(cb=>{
    cb.onclick=async(e)=>{
      e.stopPropagation();
      const ikey=cb.dataset.cb,wIdx=parseInt(cb.dataset.weekidx),i=parseInt(cb.dataset.i),km=parseFloat(cb.dataset.km);
      const cur=plan.progress[ikey]||{done:false,actualKm:null};
      cur.done=!cur.done;if(cur.done&&(cur.actualKm==null||cur.actualKm===''))cur.actualKm=km;
      plan.progress[ikey]=cur;await savePlan(plan);renderTabPlan(plan,c);
    };
  });
  // Km inputs
  c.querySelectorAll("[data-inp]").forEach(inp=>{
    inp.onclick=(e)=>e.stopPropagation();
    inp.onchange=async(e)=>{
      const ikey=inp.dataset.inp;
      const cur=plan.progress[ikey]||{done:false,actualKm:null};
      cur.actualKm=e.target.value;plan.progress[ikey]=cur;await savePlan(plan);
      const lb=c.querySelector(`[data-logbtn="${ikey}"]`);
      if(lb)lb.textContent='Marker gennemført · '+e.target.value+' km';
    };
  });
  // Log buttons
  c.querySelectorAll("[data-logbtn]").forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const ikey=btn.dataset.logbtn,wIdx=parseInt(btn.dataset.weekidx),i=parseInt(btn.dataset.i),km=parseFloat(btn.dataset.km);
      const cur=plan.progress[ikey]||{done:false,actualKm:null};
      cur.done=true;if(!cur.actualKm||cur.actualKm==='')cur.actualKm=km;
      plan.progress[ikey]=cur;await savePlan(plan);openItemKey=null;renderTabPlan(plan,c);
    };
  });
}

/* ---------------- TAB: TAL ---------------- */
function renderTabTal(plan,c){
  const s=computeStats(plan);
  // Longest done session
  let longestKm=0;
  plan.weeks.forEach((w,wIdx)=>{w.items.forEach((item,i)=>{const p=plan.progress[keyFor(wIdx,i)];if(p&&p.done){const a=(p.actualKm!=null&&p.actualKm!=="")?Number(p.actualKm):item[1];if(a>longestKm)longestKm=a;}});});
  // Weeks to event
  let weeksToEvent="—";
  if(plan.startDate){
    const planEnd=new Date(plan.startDate);planEnd.setDate(planEnd.getDate()+plan.weeksAvailable*7);
    const now=new Date();now.setHours(0,0,0,0);
    const diff=Math.ceil((planEnd-now)/(7*24*60*60*1000));
    weeksToEvent=diff>0?diff:(diff<=0?"Færdig":diff);
  }
  // Bar chart: km done per week
  const weekKms=plan.weeks.map((w,wIdx)=>w.items.reduce((acc,item,i)=>{const p=plan.progress[keyFor(wIdx,i)];if(p&&p.done)return acc+((p.actualKm!=null&&p.actualKm!=="")?Number(p.actualKm):item[1]);return acc;},0));
  const maxKm=Math.max(...weekKms,1);
  const cW=280,cH=80;
  const bW=Math.max(2,Math.floor(cW/plan.weeks.length)-2);
  const bars=weekKms.map((km,i)=>{
    const h=Math.max(2,Math.round((km/maxKm)*cH));
    const x=(i*(cW/plan.weeks.length)).toFixed(1);
    const y=(cH-h).toFixed(1);
    const fill=i===s.activeWeek-1?"var(--yellow)":(km>0?"var(--text)":"#e8e8e8");
    return`<rect x="${x}" y="${y}" width="${bW}" height="${h}" fill="${fill}"/>`;
  }).join("");
  // Phase progress bars
  const phases={};
  plan.weeks.forEach((w,wIdx)=>{
    const ph=w.phase.replace(/\s*·.*/,"");
    if(!phases[ph])phases[ph]={total:0,done:0};
    w.items.forEach((item,i)=>{phases[ph].total+=item[1];const p=plan.progress[keyFor(wIdx,i)];if(p&&p.done)phases[ph].done+=(p.actualKm!=null&&p.actualKm!=="")?Number(p.actualKm):item[1];});
  });
  const phaseBars=Object.entries(phases).map(([name,d])=>{
    const pct=d.total>0?Math.round((d.done/d.total)*100):0;
    return`<div class="phase-bar-item"><div class="phase-bar-header"><span>${name}</span><span>${d.done}/${d.total} km · ${pct}%</span></div><div class="phase-bar-track"><div class="phase-bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join("");

  c.innerHTML=`<div class="tal-grid">
    <div class="tal-stat"><div class="tal-num">${s.doneKm}</div><div class="tal-lbl">Km kørt</div></div>
    <div class="tal-stat"><div class="tal-num">${s.doneSessions}</div><div class="tal-lbl">Træninger</div></div>
    <div class="tal-stat"><div class="tal-num">${longestKm}</div><div class="tal-lbl">Længste tur</div></div>
    <div class="tal-stat"><div class="tal-num">${weeksToEvent}</div><div class="tal-lbl">Uger til turen</div></div>
  </div>
  <div class="chart-section">
    <div class="chart-label">Km pr. uge</div>
    <svg width="100%" viewBox="0 0 ${cW} ${cH}" preserveAspectRatio="none" style="display:block;">${bars}</svg>
  </div>
  <div class="phase-bars">
    <div class="chart-label" style="margin-bottom:16px;">Fase-fremdrift</div>
    ${phaseBars}
  </div>
  <div class="tab-danger">
    <button class="btn-danger" id="resetBtn">Nulstil fremdrift</button>
    <button class="btn-danger" id="deleteBtn" style="margin-top:8px;">Slet plan</button>
  </div>
  <div style="height:32px;"></div>`;

  let resetArmed=false;
  document.getElementById("resetBtn").onclick=async()=>{
    if(resetArmed){plan.progress={};await savePlan(plan);resetArmed=false;renderTabTal(plan,c);return;}
    resetArmed=true;const b=document.getElementById("resetBtn");
    b.textContent="⚠ Sikker? Tryk igen";b.style.borderColor="var(--red)";b.style.color="var(--red)";
    setTimeout(()=>{resetArmed=false;const rb=document.getElementById("resetBtn");if(rb){rb.textContent="Nulstil fremdrift";rb.style.borderColor="";rb.style.color="";}},3000);
  };
  let deleteArmed=false;
  document.getElementById("deleteBtn").onclick=async()=>{
    if(deleteArmed){
      const id=plan.id;state.planIndex=state.planIndex.filter(p=>p.id!==id);
      await saveIndex(state.planIndex);await withTimeout(window.storage.delete("plan-"+id),6000,null);
      delete state.planCache[id];state.activePlan=null;openWeekIdx=null;planTab="today";state.view="library";render();return;
    }
    deleteArmed=true;const b=document.getElementById("deleteBtn");
    b.textContent="⚠ Sikker? Tryk igen for at slette";b.style.borderColor="var(--red)";b.style.color="var(--red)";
    setTimeout(()=>{deleteArmed=false;const db=document.getElementById("deleteBtn");if(db){db.textContent="Slet plan";db.style.borderColor="";db.style.color="";}},3000);
  };
}

/* ---------------- SCREENSHOT IMPORT ---------------- */
async function handleScreenshot(file){
  const area=document.getElementById("importArea");
  area.innerHTML=`<div class="import-status">Analysing image…</div>`;
  const reader=new FileReader();
  reader.readAsDataURL(file);
  reader.onerror=()=>{area.innerHTML=resetUploadHtml("Could not read the file. Please try again.");wireUploadArea();};
  reader.onload=async()=>{
    const dataUrl=reader.result;
    const commaIdx=dataUrl.indexOf(",");
    const base64=dataUrl.slice(commaIdx+1);
    const mediaType=dataUrl.slice(0,commaIdx).match(/:(.*?);/)[1];
    try{
      const response=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:base64,mediaType,sport:state.activePlan.sport})});
      const json=await response.json();
      if(!response.ok){area.innerHTML=resetUploadHtml(json.error||"Something went wrong. Please try again.");wireUploadArea();return;}
      const activities=json.activities;
      if(!Array.isArray(activities)||activities.length===0){area.innerHTML=resetUploadHtml("No activities found in the image. Try a clearer screenshot.");wireUploadArea();return;}
      const openSlots=[];
      state.activePlan.weeks.forEach((w,wIdx)=>{w.items.forEach((item,i)=>{const p=state.activePlan.progress[keyFor(wIdx,i)];if(!p||!p.done)openSlots.push({wIdx,i,label:"Week "+(wIdx+1)+" · "+item[0]});});});
      let rowsHtml=activities.map((act,idx)=>{
        const opts=openSlots.map(s=>`<option value="${s.wIdx}_${s.i}">${s.label}</option>`).join("");
        return `<div class="activity-row"><span>${act.date} · ${act.name} · ${act.km} km</span><select id="assign_${idx}">${opts}</select><button class="btn-outline" style="padding:6px 12px;font-size:11px;" data-idx="${idx}">Log it</button></div>`;
      }).join("");
      area.innerHTML=`<div class="import-status" style="margin-bottom:8px;">Match your activities to sessions:</div>`+rowsHtml;
      area.querySelectorAll("button[data-idx]").forEach(btn=>{
        btn.onclick=async()=>{
          const idx=btn.dataset.idx;const act=activities[idx];
          const sel=document.getElementById("assign_"+idx).value;
          const[wIdx,i]=sel.split("_").map(Number);
          state.activePlan.progress[keyFor(wIdx,i)]={done:true,actualKm:act.km,source:act.name+" ("+act.date+")"};
          await savePlan(state.activePlan);render();
          btn.closest(".activity-row").style.opacity="0.4";btn.textContent="Logged";btn.disabled=true;
        };
      });
    }catch(e){area.innerHTML=resetUploadHtml("Something went wrong. Check your connection and try again.");wireUploadArea();}
  };
}
function resetUploadHtml(err){
  return`${err?`<div class="import-status" style="color:var(--red);margin-bottom:10px;">${err}</div>`:""}
    <div class="upload-area" id="uploadDropzone">
      <label class="upload-label" for="screenshotInput">Vælg billede</label>
      <input type="file" id="screenshotInput" accept="image/*" style="display:none;">
      <div class="upload-hint">PNG, JPG eller WebP · Strava, Garmin, Polar og mere</div>
    </div>`;
}
function wireUploadArea(){
  const fi=document.getElementById("screenshotInput");
  const dz=document.getElementById("uploadDropzone");
  if(!fi||!dz)return;
  fi.onchange=(e)=>{if(e.target.files[0])handleScreenshot(e.target.files[0]);};
  dz.onclick=()=>fi.click();
  dz.ondragover=(e)=>{e.preventDefault();dz.classList.add("dragging");};
  dz.ondragleave=()=>dz.classList.remove("dragging");
  dz.ondrop=(e)=>{e.preventDefault();dz.classList.remove("dragging");const f=e.dataTransfer.files[0];if(f&&f.type.startsWith("image/"))handleScreenshot(f);};
}

/* ---------------- ROUTER ---------------- */
function render(){
  if(state.view==="library")renderLibrary();
  else if(state.view==="wizard")renderWizard();
  else if(state.view==="plan")renderPlanView();
}
(async function init(){
  renderLibrary(true);
  state.planIndex=await loadIndex();
  if(state.view==="library")renderLibrary(false);
})();
</script>
</body>
</html>
